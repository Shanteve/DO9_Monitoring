global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'node-exporter'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: '.*node-exporter.*'
        action: keep
      
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: instance
      
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node_hostname
      
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service

  - job_name: 'cadvisor'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: '.*cadvisor.*'
        action: keep
      
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: instance
      
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node_hostname
      
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service

  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ["blackbox-exporter:9115"]
  
  - job_name: 'blackbox-nginx'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - "https://www.google.com/"
        - "nginx:8081/actuator/health"
        - "nginx:8087/actuator/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  
  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.gateway-service']
        type: 'A'
        port: 8087
  
  - job_name: 'booking-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.booking-service']
        type: 'A'
        port: 8083

  - job_name: 'hotel-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.hotel-service']
        type: 'A'
        port: 8082

  - job_name: 'loyalty-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.loyalty-service']
        type: 'A'
        port: 8085

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.payment-service']
        type: 'A'
        port: 8084
  
  - job_name: 'report-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.report-service']
        type: 'A'
        port: 8086

  - job_name: 'session-service'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.session-service']
        type: 'A'
        port: 8081

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'