global:
  resolve_timeout: 5m

route:
  receiver: telegram-and-email
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'telegram-and-email'
    telegram_configs:
      - send_resolved: true
        bot_token_file: /run/secrets/telegram_token
        chat_id: 667007181
    email_configs:
      - send_resolved: true
        to: 'formeilyag@gmail.com'
        from: 'formeilyag@gmail.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'formeilyag@gmail.com'
        auth_password_file: /run/secrets/gmail_token
        require_tls: true